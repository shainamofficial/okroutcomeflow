name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Placeholders so the Supabase client can be constructed in tests and
      # the production build; real values are injected by the hosting provider.
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (all workspaces)
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build web
        run: npm run build
